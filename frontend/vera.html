<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0f0f0f" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>VÉRA · Command Center</title>
<style>
  @font-face{font-family:Outfit;font-style:normal;font-weight:100 900;font-display:swap;
    src:url(/vendor/outfit-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:Outfit;font-style:normal;font-weight:100 900;font-display:swap;
    src:url(/vendor/outfit-latinext.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  :root{
    color-scheme:dark;
    --bg:#0f0f0f; --panel:#18191f; --panel2:#151528; --raise:#20222c; --chip:#1e1f27;
    --ink:#ffffff; --ink2:#c9ccd6; --mut:#8a8f9c; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --red:#ff4b1e; --gold:#ffbd12; --mint:#56cca9; --blue:#5b8cff; --violet:#8f7bff;
    --sans:Outfit,"Outfit Fallback",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --r:18px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
    background:
      radial-gradient(900px 480px at 88% -8%, rgba(255,75,30,.13), transparent 60%),
      radial-gradient(760px 420px at -6% 8%, rgba(86,204,169,.10), transparent 55%), var(--bg);}
  .wrap{max-width:1340px;margin:0 auto;padding:18px 20px 70px}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a2b33;border-radius:9px}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:8px 0 18px}
  .brand{display:flex;align-items:center;gap:13px}
  .mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--red),#ff7a1e);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:23px;box-shadow:0 8px 26px rgba(255,75,30,.35)}
  .brand h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.01em}
  .brand small{color:var(--mut);font-size:12px;font-weight:500;display:block;margin-top:-2px}
  .hbtns{display:flex;align-items:center;gap:8px}
  .hbtns a{font-family:var(--sans);font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);
    background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:9px 14px}
  .hbtns a:hover{border-color:var(--red);color:var(--red)}
  .mlogo{height:36px;opacity:.92;filter:brightness(1.7)}

  .thesis{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,rgba(255,75,30,.14),rgba(255,189,18,.05) 60%,transparent);
    border:1px solid var(--line2);border-radius:20px;padding:15px 18px;margin-bottom:16px;font-size:15px;line-height:1.5}
  .thesis .em{font-size:26px}
  .thesis b{color:#fff;font-weight:700} .thesis .big{font-weight:800;color:var(--red);font-size:19px}

  .filterrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .filterrow .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700}
  .pill{font-family:var(--sans);font-size:13px;font-weight:650;padding:9px 15px;border-radius:999px;cursor:pointer;
    background:var(--chip);border:1px solid var(--line2);color:var(--ink2);transition:.12s}
  .pill:hover{border-color:var(--mint);color:var(--ink)}
  .pill.on{background:var(--mint);border-color:var(--mint);color:#06231b}

  .kbar{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:20px}
  @media(max-width:1000px){.kbar{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;inset:0 auto auto 0;width:46px;height:46px;border-radius:0 0 46px 0;
    background:var(--accent,var(--blue));opacity:.16}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;position:relative}
  .kpi .v{font-size:30px;font-weight:800;margin-top:8px;color:var(--val,var(--ink));letter-spacing:-.02em}
  .kpi .s{font-size:12px;color:var(--ink2);margin-top:4px}

  .grid{display:grid;grid-template-columns:330px 1fr 350px;gap:15px;align-items:start}
  @media(max-width:1200px){.grid{grid-template-columns:1fr 1fr}.col-ai{grid-column:1/-1}}
  @media(max-width:780px){.grid{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px}
  .panel h2{margin:0 0 3px;font-size:14px;font-weight:750;letter-spacing:-.01em}
  .panel .cap{color:var(--mut);font-size:12px;margin-bottom:13px}

  .qcard{background:var(--panel2);border:1px solid var(--line2);border-radius:15px;padding:13px 14px;cursor:pointer;
    border-left:4px solid var(--edge,var(--mut));transition:.12s}
  .qcard+.qcard{margin-top:10px}
  .qcard:hover{background:var(--raise);transform:translateX(2px)} .qcard.sel{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint)}
  .qcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tag{font-size:10px;font-weight:800;letter-spacing:.05em;padding:4px 9px;border-radius:8px}
  .tag.ORDER{background:rgba(255,75,30,.18);color:var(--red)}
  .tag.EXPIRY{background:rgba(255,189,18,.18);color:var(--gold)}
  .qcard .nm{font-weight:700;font-size:14px;margin:8px 0 3px}
  .qcard .rs{font-size:12px;color:var(--ink2);line-height:1.45}
  .qcard .mt{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--mut)}
  .qcard .mt b{color:var(--ink);font-weight:700}
  .when{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--gold)}
  .mini{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--edge)}
  .mini+.mini{margin-top:8px} .mini:hover{background:var(--raise)}
  .mini .nm{font-size:12.5px;font-weight:600} .mini .cv{font-family:var(--mono);font-weight:700;font-size:12.5px}

  .skuhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
  .skuhead .t{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .skuhead .meta{font-size:12px;color:var(--mut);margin-top:2px}
  .stat{display:flex;gap:22px;margin:12px 0 6px;flex-wrap:wrap}
  .stat div{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .stat b{display:block;font-size:20px;font-weight:800;color:var(--ink);margin-top:3px;letter-spacing:-.01em}
  .reco{margin-top:14px;border-radius:15px;padding:14px 15px;font-size:13.5px;display:flex;gap:13px;align-items:center;line-height:1.45}
  .reco.ORDER{background:rgba(255,75,30,.11);border:1px solid rgba(255,75,30,.4)}
  .reco.EXPIRY{background:rgba(255,189,18,.10);border:1px solid rgba(255,189,18,.4)}
  .reco .ic{font-size:24px} .reco b{font-weight:800}
  .draft{margin-left:auto;font-family:var(--sans);font-weight:800;font-size:12.5px;border:none;border-radius:12px;
    padding:10px 15px;cursor:pointer;background:var(--red);color:#fff;white-space:nowrap}
  .draft:hover{filter:brightness(1.08)}
  .legend{display:flex;gap:17px;font-size:11.5px;color:var(--ink2);margin-top:9px;flex-wrap:wrap}
  .legend i{width:15px;height:0;border-top:3px solid;display:inline-block;vertical-align:middle;margin-right:5px;border-radius:3px}

  .ai-log{display:flex;flex-direction:column;gap:9px;max-height:310px;overflow:auto;margin-bottom:11px}
  .ai-b{max-width:88%;padding:10px 13px;border-radius:14px;font-size:12.5px;line-height:1.5;white-space:pre-wrap}
  .ai-b.user{align-self:flex-end;background:var(--red);color:#fff;font-weight:500}
  .ai-b.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line2)}
  .ai-b.think{opacity:.6;font-style:italic}
  .ai-b .src{display:block;margin-top:7px;font-size:10px;color:var(--mut)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-family:var(--sans);font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);
    background:var(--panel2);cursor:pointer;color:var(--ink2)}
  .chip:hover{border-color:var(--mint);color:var(--mint)}
  .aiin{display:flex;gap:8px}
  .aiin input{flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:13px;padding:11px 13px;color:var(--ink);font-family:var(--sans);font-size:13.5px}
  .aiin button{border:none;border-radius:13px;background:var(--mint);color:#06231b;font-weight:800;padding:0 16px;cursor:pointer;font-size:16px}
  .health{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .health.on{background:rgba(86,204,169,.16);color:var(--mint)} .health.off{background:rgba(255,75,30,.16);color:var(--red)}
  .loading{padding:80px;text-align:center;color:var(--mut);font-size:15px}
  .foot{margin-top:18px;font-size:11.5px;color:var(--mut)}
  .recharts-text{fill:var(--mut)}
  .langsw{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .langsw button{font-family:var(--sans);font-size:12px;font-weight:700;padding:8px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);cursor:pointer}
  .langsw button.on{background:var(--red);color:#fff;border-color:var(--red)}
</style>
</head>
<body>
<div class="wrap"><div id="root"><div class="loading" data-i18n="vera_title">Initialisation de VÉRA…</div></div></div>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script src="/vendor/prop-types.js"></script>
<script src="/vendor/recharts.js"></script>
<script src="/vendor/babel.js"></script>
<script src="/i18n.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const R = Recharts;
const { ResponsiveContainer, ComposedChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ReferenceLine, ReferenceArea } = R;
const C = { mint:"#56cca9", red:"#ff4b1e", gold:"#ffbd12", blue:"#5b8cff", violet:"#8f7bff", ink2:"#c9ccd6", mut:"#8a8f9c", line:"rgba(255,255,255,.10)", panel:"#18191f" };
const api = (u, b) => fetch(u, b ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)} : {}).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });
const T = (k) => (window.t ? window.t(k) : k);
const TF = (k, v) => (window.tf ? window.tf(k, v) : k);
const eur = (v) => v==null ? "—" : "€"+Number(v).toLocaleString("fr-FR",{maximumFractionDigits:0});
const n1 = (v) => v==null ? "—" : Number(v).toLocaleString("fr-FR",{maximumFractionDigits:1});

function KPI({label, value, sub, accent, val}) {
  return <div className="kpi" style={{"--accent":accent, "--val":val||"var(--ink)"}}>
    <div className="l">{label}</div><div className="v num">{value}</div><div className="s">{sub}</div></div>;
}

function Runway({code}) {
  const [p, setP] = useState(null);
  useEffect(() => { if(code){ setP(null); api(`/api/vera/sku/${code}`).then(setP); } }, [code]);
  if (!code) return <div className="panel"><div className="cap">{T("vera_runway_select")}</div></div>;
  if (!p) return <div className="panel"><div className="loading">{T("vera_runway_loading")}</div></div>;
  const pr = p.projection, rec = p.recommendation;
  const data = pr.trajectory.map((s,i) => ({ d:i, stock:s }));
  return <div className="panel">
    <div className="skuhead">
      <div><div className="t">{pr.name}</div>
        <div className="meta">{pr.supplier} · délai {pr.lead} j · coût {eur(pr.unit_cost)}/{pr.unit}</div></div>
      <span className="tag" style={{background:"rgba(91,140,255,.16)",color:C.blue}}>{T("vera_runway_title")}</span>
    </div>
    <div className="stat">
      <div>{T("vera_runway_stock")}<b>{n1(pr.on_hand)} {pr.unit}</b></div>
      <div>{T("vera_runway_cover")}<b style={{color: pr.days_cover < pr.lead ? C.red : "var(--ink)"}}>{n1(pr.days_cover)} {T("vera_runway_days")}</b></div>
      <div>{T("vera_runway_daily")}<b>{n1(pr.avg_daily)}</b></div>
      <div>{T("vera_runway_out")}<b style={{color:C.red}}>{pr.stockout_day!=null? TF("vera_decision_day", {day: pr.stockout_day}) : "—"}</b></div>
      <div>{T("vera_runway_expiry")}<b style={{color:C.gold}}>{pr.expiry_day!=null? TF("vera_decision_day", {day: pr.expiry_day}) : "—"}</b></div>
    </div>
    <ResponsiveContainer width="100%" height={262}>
      <ComposedChart data={data} margin={{top:14,right:14,left:-6,bottom:2}}>
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor={C.mint} stopOpacity={0.32}/><stop offset="1" stopColor={C.mint} stopOpacity={0}/></linearGradient></defs>
        <CartesianGrid stroke={C.line} strokeDasharray="3 3" vertical={false}/>
        {pr.lead!=null && <ReferenceArea x1={0} x2={pr.lead} fill="#ffffff" fillOpacity={0.05} />}
        <XAxis dataKey="d" type="number" domain={[0, data.length]} tick={{fill:C.ink2,fontSize:11}} tickLine={false} axisLine={{stroke:C.line}} label={{value:T("vera_runway_chart"), position:"insideBottomRight", fill:C.mut, fontSize:10, dy:12}}/>
        <YAxis tick={{fill:C.ink2,fontSize:11}} tickLine={false} axisLine={false} width={44}/>
        <Tooltip contentStyle={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:12,fontSize:12,color:"#fff"}} labelFormatter={(d)=>`J+${d}`} formatter={(v)=>[n1(v)+" "+pr.unit,"stock"]}/>
        <Area type="monotone" dataKey="stock" stroke={C.mint} strokeWidth={2.6} fill="url(#g)" isAnimationActive={true} animationDuration={650}/>
        {pr.stockout_day!=null && <ReferenceLine x={pr.stockout_day} stroke={C.red} strokeWidth={2.4} strokeDasharray="5 4" label={{value:`${T("vera_runway_stockout")} ${TF("vera_decision_day", {day: pr.stockout_day})}`, fill:C.red, fontSize:10, fontWeight:700, position:"top"}}/>}
        {pr.expiry_day!=null && <ReferenceLine x={pr.expiry_day} stroke={C.gold} strokeWidth={2.4} strokeDasharray="5 4" label={{value:`${T("vera_runway_expiry_line")} ${TF("vera_decision_day", {day: pr.expiry_day})}`, fill:C.gold, fontSize:10, fontWeight:700, position:"insideTopRight"}}/>}
        <ReferenceLine y={0} stroke={C.line}/>
      </ComposedChart>
    </ResponsiveContainer>
    <div className="legend">
      <span><i style={{borderColor:C.mint}}></i>{T("vera_runway_stock_proj")}</span>
      <span><i style={{borderColor:C.red,borderTopStyle:"dashed"}}></i>{T("vera_runway_stockout")}</span>
      <span><i style={{borderColor:C.gold,borderTopStyle:"dashed"}}></i>{T("vera_runway_expiry_line")}</span>
      <span style={{color:C.mut}}>▨ {T("vera_runway_window")}</span>
    </div>
    {rec && <div className={"reco "+rec.action}>
      <span className="ic">{rec.action==="ORDER"?"📦":"⏳"}</span>
      <div>{rec.action==="ORDER"
        ? <span>{TF("vera_reco_order", {qty:n1(rec.qty), unit:rec.unit, day:rec.order_by_day, supplier:rec.supplier, reason:rec.reason})}</span>
        : <span>{TF("vera_reco_expiry", {qty:n1(rec.qty), unit:rec.unit, value:eur(rec.value), day:rec.order_by_day})}</span>}
      </div>
      {rec.action==="ORDER" && <button className="draft" onClick={()=>alert(TF("vera_prepare_bc_msg", {qty:n1(rec.qty), unit:rec.unit, name:rec.name, supplier:rec.supplier, value:eur(rec.value)}))}>{T("vera_prepare_bc")}</button>}
    </div>}
  </div>;
}

function Copilot() {
  const [log, setLog] = useState([]);
  const [health, setHealth] = useState(null);
  const inRef = useRef(); const boxRef = useRef();
  useEffect(() => { api("/api/assistant/health").then(h=>setHealth(h.available)).catch(()=>setHealth(false)); }, []);
  useEffect(() => { if(boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; }, [log]);
  const chips = [T("vera_copilot_chip_1"), T("vera_copilot_chip_2"), T("vera_copilot_chip_3"), T("vera_copilot_chip_4")];
  const ask = async (msg) => {
    if(!msg) return;
    const hist = log.filter(m=>!m.think).map(m => ({role:m.role==="user"?"user":"assistant", content:m.text}));
    setLog(l => [...l, {role:"user",text:msg}, {role:"bot",text:T("vera_copilot_loading"),think:true}]);
    try { const r = await api("/api/vera/chat", {message:msg, history:hist});
      setLog(l => { const c=[...l]; c[c.length-1]={role:"bot",text:r.answer,src:r.sources}; return c; }); }
    catch(e) { setLog(l => { const c=[...l]; c[c.length-1]={role:"bot",text:T("vera_copilot_offline")}; return c; }); }
  };
  return <div className="panel">
    <h2 style={{display:"flex",alignItems:"center",gap:8,justifyContent:"space-between"}}>{T("vera_copilot_title")} <span className={"health "+(health?"on":"off")}>{health==null?T("vera_copilot_health_wait"):health?T("vera_copilot_health_on"):T("vera_copilot_health_off")}</span></h2>
    <div className="cap">{T("vera_copilot_cap")}</div>
    <div className="ai-log" ref={boxRef}>{log.map((m,i)=>
      <div key={i} className={"ai-b "+(m.role==="user"?"user":"bot")+(m.think?" think":"")}>{m.text}
        {m.src && m.src.length ? <span className="src">📚 {m.src.join(", ")}</span> : null}</div>)}</div>
    <div className="chips">{chips.map((c,i)=><span key={i} className="chip" onClick={()=>ask(c)}>{c}</span>)}</div>
    <div className="aiin">
      <input ref={inRef} placeholder={T("vera_copilot_placeholder")} onKeyDown={e=>{if(e.key==="Enter"){ask(e.target.value.trim());e.target.value="";}}}/>
      <button onClick={()=>{ask(inRef.current.value.trim());inRef.current.value="";}}>▸</button>
    </div>
  </div>;
}

function App() {
  const [product, setProduct] = useState("all");
  const [lang, setLang] = useState(window.i18n ? window.i18n.lang : "fr");
  const [ov, setOv] = useState(null);
  const [skus, setSkus] = useState([]);
  const [sel, setSel] = useState(null);
  useEffect(() => {
    const onLang = () => setLang(window.i18n ? window.i18n.lang : "fr");
    window.onLangChange = onLang;
    return () => { window.onLangChange = null; };
  }, []);
  useEffect(() => {
    const q = product==="all" ? "" : "?product="+encodeURIComponent(product);
    Promise.all([api("/api/vera/overview"+q), api("/api/vera/skus"+q)]).then(([o,s]) => {
      setOv(o); setSkus(s);
      const first = o.decisions[0] || s[0];
      setSel(first ? first.code : null);
    });
  }, [product]);
  if (!ov) return <div className="loading">{T("vera_title")}</div>;
  const k = ov.kpis;
  const prods = ov.products || [];
  return <div>
    <header>
      <div className="brand">
        <img className="mark" src="/icons/vera-icon.png" alt="VÉRA" style={{width:44,height:44,objectFit:"contain",background:"none",borderRadius:0}} />
        <div><h1>{T("vera_title")}</h1><small>{T("vera_subtitle")}</small></div>
        <img className="mlogo" src="/icons/medicka-logo.png" alt="Medicka"/>
      </div>
      <div className="hbtns">
        <div className="langsw"><button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="ar">ع</button></div>
        <a href="/app">← {T("vera_home")}</a><a href="/floor">📱 {T("vera_floor")}</a>
      </div>
    </header>

    <div className="thesis">
      <span className="em">🧠</span>
      <div>{TF("vera_thesis", {gap: k.truth_gap_pct, eur: eur(k.truth_gap_eur)})}</div>
    </div>

    <div className="filterrow">
      <span className="lbl">{T("vera_filter_label")}</span>
      <span className={"pill"+(product==="all"?" on":"")} onClick={()=>setProduct("all")}>{T("vera_filter_all")}</span>
      {prods.map(p => <span key={p.code} className={"pill"+(product===p.code?" on":"")} onClick={()=>setProduct(p.code)}>{p.name}</span>)}
    </div>

    <div className="kbar">
      <KPI label={T("vera_kpi_truth_gap")} value={"+"+k.truth_gap_pct+"%"} sub={TF("vera_kpi_truth_gap_sub", {eur: eur(k.truth_gap_eur)})} accent={C.violet} val={C.violet}/>
      <KPI label={T("vera_kpi_urgent")} value={k.urgent_count} sub={k.urgent_soonest!=null? TF("vera_kpi_urgent_sub", {when: TF("vera_decision_day", {day: k.urgent_soonest})}) : T("vera_kpi_urgent_sub", {when: "—"})} accent={C.red} val={k.urgent_count>0?C.red:"var(--ink)"}/>
      <KPI label={T("vera_kpi_order")} value={k.order_now_count} sub={T("vera_kpi_order_sub")} accent={C.blue} val={C.blue}/>
      <KPI label={T("vera_kpi_expiry")} value={eur(k.expiry_value)} sub={T("vera_kpi_expiry_sub")} accent={C.gold} val={k.expiry_value>0?C.gold:"var(--ink)"}/>
      <KPI label={T("vera_kpi_stock")} value={eur(k.inventory_value)} sub={TF("vera_kpi_stock_sub", {dormant: eur(k.dead_stock_value)})} accent={C.mint}/>
    </div>

    <div className="grid">
      <div className="col">
        <div className="panel">
          <h2>{T("vera_decisions")}</h2>
          <div className="cap">{TF("vera_decisions_sub", {n: ov.decisions.length})}</div>
          {ov.decisions.map((r,i) => <div key={i} className={"qcard"+(sel===r.code?" sel":"")} style={{"--edge":r.action==="ORDER"?C.red:C.gold}} onClick={()=>setSel(r.code)}>
            <div className="top"><span className={"tag "+r.action}>{r.action==="ORDER"?T("vera_action_order_label"):T("vera_action_expiry_label")}</span>
              <span className="when">{r.order_by_day<=0?T("vera_decision_today"):TF("vera_decision_day", {day: r.order_by_day})}</span></div>
            <div className="nm">{r.name}</div>
            <div className="rs">{r.reason}</div>
            <div className="mt"><span>{T("vera_qty")} <b>{n1(r.qty)} {r.unit}</b></span><span>{T("vera_value")} <b>{eur(r.value)}</b></span><span>{r.supplier}</span></div>
          </div>)}
          {ov.decisions.length===0 && <div className="cap">{T("vera_no_actions")}</div>}
        </div>
        <div className="panel">
          <h2>{TF("vera_materials", {n: skus.length})}</h2>
          <div className="cap">{T("vera_materials_sub")}</div>
          {skus.slice(0,9).map((s,i) => { const col = s.status==="critical"?C.red:s.status==="warning"?C.gold:C.mint;
            return <div key={i} className="mini" style={{"--edge":col}} onClick={()=>setSel(s.code)}>
              <span className="nm">{s.name}</span><span className="cv" style={{color:col}}>{n1(s.days_cover)} j</span></div>; })}
        </div>
      </div>
      <div className="col"><Runway code={sel}/></div>
      <div className="col col-ai"><Copilot/></div>
    </div>
    <div className="foot">{TF("vera_foot", {days: k.horizon})}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
